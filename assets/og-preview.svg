<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="groutBar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="50%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f97316"/>
    </linearGradient>
    <linearGradient id="tileGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Construction Caution Striping Top/Bottom -->
  <g opacity="0.2">
    <pattern id="stripes" width="40" height="40" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="40" stroke="#f59e0b" stroke-width="20"/>
    </pattern>
    <rect x="0" y="0" width="1200" height="18" fill="url(#stripes)"/>
    <rect x="0" y="612" width="1200" height="18" fill="url(#stripes)"/>
  </g>

  <!-- Big Decorative Tiles with Glowing Grout Gap -->
  <g transform="translate(680, 100)">
    <!-- Tile 1 -->
    <rect x="0" y="0" width="220" height="180" rx="16" fill="url(#tileGrad)" stroke="#334155" stroke-width="4"/>
    <rect x="250" y="0" width="220" height="180" rx="16" fill="url(#tileGrad)" stroke="#334155" stroke-width="4"/>
    <rect x="0" y="210" width="220" height="180" rx="16" fill="url(#tileGrad)" stroke="#334155" stroke-width="4"/>
    <rect x="250" y="210" width="220" height="180" rx="16" fill="url(#tileGrad)" stroke="#334155" stroke-width="4"/>

    <!-- Glowing Grout Filling the Gap -->
    <rect x="220" y="0" width="30" height="390" fill="url(#groutBar)" filter="drop-shadow(0 0 15px rgba(245, 158, 11, 0.8))"/>
    <rect x="0" y="180" width="470" height="30" fill="url(#groutBar)" filter="drop-shadow(0 0 15px rgba(245, 158, 11, 0.8))"/>

    <!-- Trowel Tool on top -->
    <g transform="translate(235, 195) rotate(-25)">
      <polygon points="0,-40 60,0 0,40 -20,0" fill="#cbd5e1" stroke="#475569" stroke-width="4"/>
      <line x1="-20" y1="0" x2="-80" y2="0" stroke="#f97316" stroke-width="14" stroke-linecap="round"/>
      <circle cx="20" cy="0" r="10" fill="#f59e0b"/>
    </g>
  </g>

  <!-- Left Content / Typography -->
  <g transform="translate(100, 120)">
    <!-- Badge -->
    <rect x="0" y="0" width="280" height="42" rx="21" fill="#f59e0b" fill-opacity="0.15" stroke="#f59e0b" stroke-width="2"/>
    <text x="140" y="27" fill="#fbbf24" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" letter-spacing="2">🔥 THE VIRAL MEME GAME</text>

    <!-- Main Title -->
    <text x="0" y="130" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="84" font-weight="900" letter-spacing="1">GROUT!</text>
    <text x="0" y="200" fill="#fbbf24" font-family="system-ui, -apple-system, sans-serif" font-size="44" font-weight="800">ISME GROUT BHAR DENGE 🧱</text>

    <!-- Subtitle / Hook -->
    <text x="0" y="260" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="500">
      <tspan x="0" dy="0">Tiles crooked? Stairs broken? Broken heart? Zero in exam?</tspan>
      <tspan x="0" dy="36">No worries! Solve life's greatest disasters with pure satisfying grout!</tspan>
    </text>

    <!-- Features Pill Badges -->
    <g transform="translate(0, 340)">
      <rect x="0" y="0" width="150" height="40" rx="8" fill="#1e293b" stroke="#334155"/>
      <text x="75" y="25" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="16" font-weight="bold" text-anchor="middle">✨ ASMR Spreading</text>

      <rect x="165" y="0" width="160" height="40" rx="8" fill="#1e293b" stroke="#334155"/>
      <text x="245" y="25" fill="#4ade80" font-family="system-ui, sans-serif" font-size="16" font-weight="bold" text-anchor="middle">🔊 Meme Soundboard</text>

      <rect x="340" y="0" width="170" height="40" rx="8" fill="#1e293b" stroke="#334155"/>
      <text x="425" y="25" fill="#f43f5e" font-family="system-ui, sans-serif" font-size="16" font-weight="bold" text-anchor="middle">🎓 Mistri Certificate</text>
    </g>
  </g>
</svg>
