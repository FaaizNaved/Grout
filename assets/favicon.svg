<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="tileGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="trowelGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>
    <linearGradient id="groutGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="50%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
  </defs>
  
  <!-- Background Tile Grids -->
  <rect width="100" height="100" rx="20" fill="#0f172a"/>
  
  <!-- Tiles -->
  <rect x="8" y="8" width="38" height="38" rx="6" fill="url(#tileGrad)"/>
  <rect x="54" y="8" width="38" height="38" rx="6" fill="url(#tileGrad)"/>
  <rect x="8" y="54" width="38" height="38" rx="6" fill="url(#tileGrad)"/>
  <rect x="54" y="54" width="38" height="38" rx="6" fill="url(#tileGrad)"/>
  
  <!-- Grout Lines (Gap filled with golden/creamy grout) -->
  <rect x="46" y="8" width="8" height="84" rx="4" fill="url(#groutGrad)"/>
  <rect x="8" y="46" width="84" height="8" rx="4" fill="url(#groutGrad)"/>

  <!-- Trowel Tool -->
  <path d="M50 20 L75 45 L62 58 L37 33 Z" fill="url(#trowelGrad)" stroke="#1e293b" stroke-width="2"/>
  <circle cx="56" cy="39" r="3" fill="#475569"/>
  <!-- Handle -->
  <path d="M62 58 L82 78" stroke="#f97316" stroke-width="7" stroke-linecap="round"/>
  <path d="M72 68 L85 81" stroke="#ea580c" stroke-width="7" stroke-linecap="round"/>
  
  <!-- Sparkle of clean grout -->
  <circle cx="50" cy="50" r="4" fill="#ffffff"/>
</svg>
