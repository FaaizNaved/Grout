<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1C1917"/>
      <stop offset="100%" stop-color="#292524"/>
    </linearGradient>
    <linearGradient id="groutBar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#9A3412"/>
      <stop offset="50%" stop-color="#B45309"/>
      <stop offset="100%" stop-color="#7C2D12"/>
    </linearGradient>
    <linearGradient id="tileGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FAF8F5"/>
      <stop offset="100%" stop-color="#E5E0D8"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Delicate Border Frame -->
  <rect x="40" y="40" width="1120" height="550" fill="none" stroke="#44403C" stroke-width="1.5"/>
  <rect x="50" y="50" width="1100" height="530" fill="none" stroke="#292524" stroke-width="1"/>

  <!-- Left Content / Typography -->
  <g transform="translate(110, 150)">
    <!-- Heritage Badge -->
    <text x="0" y="24" fill="#B45309" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="600" letter-spacing="4">STUDIO JUGAAD • EST. 1984</text>

    <!-- Main Title -->
    <text x="0" y="115" fill="#FAF8F5" font-family="'Fraunces', Georgia, serif" font-size="82" font-weight="700" letter-spacing="-1">GROUT.</text>
    <text x="0" y="175" fill="#D6CEBF" font-family="'Fraunces', Georgia, serif" font-size="34" font-weight="400" font-style="italic">The Art of "Isme Grout Bhar Denge"</text>

    <!-- Subtitle / Hook -->
    <text x="0" y="235" fill="#A8A29E" font-family="system-ui, sans-serif" font-size="20" font-weight="400">
      <tspan x="0" dy="0">Crooked bathroom tiles? Fractured stairs? Broken heart?</tspan>
      <tspan x="0" dy="30">A tactile, meditative ASMR web game inspired by the viral sensation.</tspan>
    </text>

    <!-- Minimal Badges -->
    <g transform="translate(0, 310)">
      <text x="0" y="20" fill="#78716C" font-family="'JetBrains Mono', monospace" font-size="13" letter-spacing="2">01. TACTILE ASMR</text>
      <text x="180" y="20" fill="#78716C" font-family="'JetBrains Mono', monospace" font-size="13" letter-spacing="2">02. AUDIO CLIPS</text>
      <text x="360" y="20" fill="#78716C" font-family="'JetBrains Mono', monospace" font-size="13" letter-spacing="2">03. COUNCIL DIPLOMA</text>
    </g>
  </g>

  <!-- Right Visual / Ceramic Tile Composition -->
  <g transform="translate(740, 130)">
    <!-- Tiles with warm terracotta grout lines -->
    <rect x="0" y="0" width="180" height="160" rx="6" fill="url(#tileGrad)" stroke="#D6CEBF" stroke-width="2"/>
    <rect x="200" y="0" width="180" height="160" rx="6" fill="url(#tileGrad)" stroke="#D6CEBF" stroke-width="2"/>
    <rect x="0" y="180" width="180" height="160" rx="6" fill="url(#tileGrad)" stroke="#D6CEBF" stroke-width="2"/>
    <rect x="200" y="180" width="180" height="160" rx="6" fill="url(#tileGrad)" stroke="#D6CEBF" stroke-width="2"/>

    <!-- Grout Joint Fill -->
    <rect x="180" y="0" width="20" height="340" fill="url(#groutBar)"/>
    <rect x="0" y="160" width="380" height="20" fill="url(#groutBar)"/>

    <!-- Minimal Trowel Tool -->
    <g transform="translate(190, 170) rotate(-22)">
      <polygon points="0,-35 48,0 0,35 -16,0" fill="#E7E5E4" stroke="#44403C" stroke-width="2"/>
      <line x1="-16" y1="0" x2="-65" y2="0" stroke="#78350F" stroke-width="10" stroke-linecap="round"/>
    </g>
  </g>
</svg>
