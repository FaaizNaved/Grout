<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="tileGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FAF8F5"/>
      <stop offset="100%" stop-color="#E5E0D8"/>
    </linearGradient>
    <linearGradient id="trowelGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E7E5E4"/>
      <stop offset="100%" stop-color="#A8A29E"/>
    </linearGradient>
    <linearGradient id="groutGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#9A3412"/>
      <stop offset="50%" stop-color="#B45309"/>
      <stop offset="100%" stop-color="#7C2D12"/>
    </linearGradient>
  </defs>
  
  <!-- Warm Charcoal Frame -->
  <rect width="100" height="100" rx="18" fill="#1C1917"/>
  
  <!-- Matte Limestone Tiles -->
  <rect x="10" y="10" width="36" height="36" rx="4" fill="url(#tileGrad)" stroke="#D6CEBF" stroke-width="1.5"/>
  <rect x="54" y="10" width="36" height="36" rx="4" fill="url(#tileGrad)" stroke="#D6CEBF" stroke-width="1.5"/>
  <rect x="10" y="54" width="36" height="36" rx="4" fill="url(#tileGrad)" stroke="#D6CEBF" stroke-width="1.5"/>
  <rect x="54" y="54" width="36" height="36" rx="4" fill="url(#tileGrad)" stroke="#D6CEBF" stroke-width="1.5"/>
  
  <!-- Warm Terracotta Grout Fill Lines -->
  <rect x="46" y="10" width="8" height="80" rx="3" fill="url(#groutGrad)"/>
  <rect x="10" y="46" width="80" height="8" rx="3" fill="url(#groutGrad)"/>

  <!-- Trowel Tool -->
  <path d="M48 24 L70 46 L58 58 L36 36 Z" fill="url(#trowelGrad)" stroke="#44403C" stroke-width="1.5"/>
  <circle cx="53" cy="41" r="2.5" fill="#78716C"/>
  <!-- Wood Handle -->
  <path d="M58 58 L76 76" stroke="#78350F" stroke-width="6" stroke-linecap="round"/>
</svg>
